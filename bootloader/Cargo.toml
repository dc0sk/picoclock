[package]
name = "picoclock-bootloader"
version = "0.2.2"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bootloader for the picoclock firmware (ADR-0006): swaps in a downloaded image and swaps back if it does not confirm itself"

[features]
# Pick exactly one chip, as for the firmware.
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040"]
rp235x = ["embassy-rp/rp235xa"]

[dependencies]
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", default-features = false, features = ["unstable-pac", "critical-section-impl"] }
embassy-boot-rp = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
