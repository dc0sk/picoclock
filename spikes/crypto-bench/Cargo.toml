# Throwaway feasibility spike for HTTPS / NTS: how slow is the crypto on an RP2040? Not part of the product workspace.
[package]
name = "crypto-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040", "executor-thread"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
portable-atomic = { version = "1.5", features = ["critical-section"] }
# The versions embedded-tls 0.19 uses.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "sha256", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
aes-siv = { version = "0.7", default-features = false }
rand_core = { version = "0.6", default-features = false }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

[profile.release]
opt-level = 3        # the product uses "s"; speed is what is measured here
lto = "fat"
debug = 2
codegen-units = 1
