# Source of truth for the SRS (docs/srs.md) and the traceability matrix (docs/traceability-matrix.md).
# Both are generated by `tools/trace.py render`; do not edit them by hand.
#
# [[req]]  status: draft | ratified | retired.  criticality: high | medium | low (sets how much evidence is needed).
#          `cap`   : the capabilities (code) that implement it.
#          `unverified` : ratified but no evidence exists yet; the text says why. It is listed in the matrix.
#          A statement is never edited once ratified: retire it (retired_because) and add a new ID (supersedes).
# [[cap]]  `code` globs bind every production source file to exactly one capability.
# Evidence is bound in the code and the log, not here:
#   unit tests : a `// VERIFIES: REQ-..` comment directly above the #[test]
#   records    : `Verifies:` lines in docs/verification-log.md

# ---------------------------------------------------------------------------------------------------- capabilities

[[cap]]
id = "CAP-FRAME"
name = "Frame buffer and font"
code = ["core/src/font.rs", "core/src/frame.rs"]

[[cap]]
id = "CAP-TIME"
name = "Calendar maths"
code = ["core/src/time.rs"]

[[cap]]
id = "CAP-TZ"
name = "Timezone rules and zone table"
code = ["core/src/tz.rs", "core/src/tzdb.rs"]

[[cap]]
id = "CAP-GEO"
name = "IP geolocation reply parser"
code = ["core/src/geo.rs"]

[[cap]]
id = "CAP-SNTP"
name = "SNTP packets and client transport"
code = ["core/src/sntp.rs", "firmware/src/ntp.rs"]

[[cap]]
id = "CAP-NTS"
name = "NTS client: key exchange, authenticated packets, sessions"
code = ["core/src/nts.rs", "core/src/nts_ke.rs", "firmware/src/nts.rs"]

[[cap]]
id = "CAP-CONFIG"
name = "Configuration model and flash storage"
code = ["core/src/config.rs", "firmware/src/storage.rs"]

[[cap]]
id = "CAP-CLI"
name = "Terminal commands and USB serial console"
code = ["core/src/cli.rs", "firmware/src/usb_cli.rs"]

[[cap]]
id = "CAP-HTTP"
name = "HTTP parsing, settings page and web server"
code = ["core/src/http.rs", "firmware/src/web.rs"]

[[cap]]
id = "CAP-UI"
name = "Button, menu, alarm and view state machine"
code = ["core/src/ui.rs"]

[[cap]]
id = "CAP-DISPLAY"
name = "LED matrix scan"
code = ["firmware/src/display.rs"]

[[cap]]
id = "CAP-INPUT"
name = "Button polling"
code = ["firmware/src/buttons.rs"]

[[cap]]
id = "CAP-BUZZER"
name = "Buzzer driver"
code = ["firmware/src/buzzer.rs"]

[[cap]]
id = "CAP-RTC"
name = "DS3231 driver"
code = ["firmware/src/rtc.rs"]

[[cap]]
id = "CAP-NET"
name = "WiFi, hourly sync, geolocation request and NTP server"
code = ["firmware/src/net.rs"]

[[cap]]
id = "CAP-APP"
name = "Composition: task wiring, shared state, chip selection"
code = ["core/src/lib.rs", "firmware/src/main.rs", "firmware/src/state.rs", "firmware/src/crypto.rs", "firmware/build.rs"]

# ---------------------------------------------------------------------------------------------------- time

[[req]]
id = "REQ-TIME-01"
area = "Time"
status = "ratified"
criticality = "high"
statement = "The real-time clock shall hold UTC, and the displayed local time shall be computed from it at display time using the configured timezone."
rationale = "A clock that stores local time needs a resync at every daylight-saving change and cannot serve correct UTC to others."
cap = ["CAP-APP", "CAP-UI", "CAP-RTC", "CAP-TIME"]

[[req]]
id = "REQ-TIME-02"
area = "Time"
status = "ratified"
criticality = "medium"
statement = "When the timezone is set to `utc`, the clock shall display UTC directly."
rationale = "Requested as an alternative to any timezone."
cap = ["CAP-UI", "CAP-CONFIG"]

[[req]]
id = "REQ-TIME-03"
area = "Time"
status = "ratified"
criticality = "high"
statement = "Calendar conversions between Unix time and civil date shall be correct across leap years, weekdays and the 2036 NTP era rollover."
rationale = "Every other time feature builds on these conversions."
cap = ["CAP-TIME", "CAP-SNTP"]

[[req]]
id = "REQ-TIME-04"
area = "Time"
status = "ratified"
criticality = "high"
statement = "After an NTP sync the real-time clock shall be set on a UTC second boundary, so its seconds match real time."
rationale = "The DS3231 restarts its second when written; writing mid-second leaves it up to one second behind."
cap = ["CAP-APP", "CAP-RTC"]

# ---------------------------------------------------------------------------------------------------- timezone

[[req]]
id = "REQ-TZ-01"
area = "Timezone"
status = "ratified"
criticality = "high"
statement = "The clock shall apply daylight-saving rules at the correct instants, including southern-hemisphere, half-hour and negative-transition-time rules."
rationale = "A wrong DST instant shows the wrong hour for a week."
cap = ["CAP-TZ"]

[[req]]
id = "REQ-TZ-02"
area = "Timezone"
status = "ratified"
criticality = "high"
statement = "The clock shall accept IANA zone names from a built-in table, case-insensitively, and every table entry shall resolve to a valid rule."
rationale = "Users know zone names, not POSIX rules; the device has no internet-independent tz database."
cap = ["CAP-TZ", "CAP-CLI"]

[[req]]
id = "REQ-TZ-03"
area = "Timezone"
status = "ratified"
criticality = "medium"
statement = "The clock shall accept POSIX TZ rules as timezone values and reject malformed values without changing the setting."
rationale = "Covers zones missing from the table."
cap = ["CAP-TZ", "CAP-CONFIG"]

[[req]]
id = "REQ-TZ-04"
area = "Timezone"
status = "ratified"
criticality = "medium"
statement = "When the timezone is `auto`, the clock shall look the zone up from its public IP, use the reply only if it names a built-in zone, cache the result and refresh it daily."
rationale = "Requested location lookup; plain HTTP is the only free option, so the reply is untrusted input."
cap = ["CAP-GEO", "CAP-NET", "CAP-CONFIG"]

[[req]]
id = "REQ-TZ-05"
area = "Timezone"
status = "ratified"
criticality = "medium"
statement = "Daylight saving time shall be a setting that is on by default; when it is off, the clock shall use the zone's standard time all year."
rationale = "Requested; some users keep standard time year-round, and the option must work for every zone, including those whose rule has a negative daylight-saving offset."
cap = ["CAP-TZ", "CAP-CONFIG"]

# ---------------------------------------------------------------------------------------------------- NTP client

[[req]]
id = "REQ-NTP-01"
area = "NTP client"
status = "ratified"
criticality = "high"
statement = "The clock shall synchronise over SNTP, trying the configured servers in order, defaulting to the DHCP gateway and pool.ntp.org."
rationale = "Requested default servers."
cap = ["CAP-SNTP", "CAP-NET", "CAP-CONFIG"]

[[req]]
id = "REQ-NTP-02"
area = "NTP client"
status = "ratified"
criticality = "high"
statement = "The client shall reject replies that are not server-mode, are unsynchronised, are stratum 0, or do not echo the request's transmit timestamp."
rationale = "A forged or stale reply must not set the clock."
cap = ["CAP-SNTP"]

[[req]]
id = "REQ-NTP-03"
area = "NTP client"
status = "ratified"
criticality = "medium"
statement = "The clock shall resynchronise hourly and on the `sync` command."
rationale = "Keeps the RTC and the software clock close to real time."
cap = ["CAP-NET", "CAP-CLI"]

[[req]]
id = "REQ-NTS-01"
area = "NTS"
status = "ratified"
criticality = "high"
statement = "A server entry `nts:<host>` in `ntp_servers` shall be contacted with NTS-KE over TLS 1.3 (ALPN ntske/1), and each NTP exchange with it shall then be authenticated with AES-SIV-CMAC-256 using the negotiated keys and a fresh cookie."
rationale = "RFC 8915: authenticated time that a network attacker cannot forge."
cap = ["CAP-NTS", "CAP-SNTP", "CAP-NET", "CAP-CONFIG"]

[[req]]
id = "REQ-NTS-02"
area = "NTS"
status = "ratified"
criticality = "high"
statement = "The NTS client shall never set the clock from a response that is unauthenticated, forged, corrupted, not an answer to its own request or replayed, and shall repeat the key exchange after an NTS NAK."
rationale = "An authenticated protocol is only as good as its refusals."
cap = ["CAP-NTS"]

[[req]]
id = "REQ-NTS-03"
area = "NTS"
status = "ratified"
criticality = "high"
statement = "The NTS key exchange shall not start while the clock has no valid time, and the order of `ntp_servers` shall be the only fallback policy: a failed `nts:` entry is followed by the next entry, and a list made only of `nts:` entries never falls back to plain NTP."
rationale = "Certificate dates cannot be checked without a time (the TLS library would skip the check silently), and a silent downgrade to unauthenticated time defeats the purpose."
cap = ["CAP-NTS", "CAP-SNTP", "CAP-CONFIG"]

[[req]]
id = "REQ-NTS-04"
area = "NTS"
status = "ratified"
criticality = "medium"
statement = "The terminal's `status` shall say whether the last sync was authenticated."
rationale = "The user must be able to see that the time they rely on is the authenticated kind."
cap = ["CAP-CLI"]

[[req]]
id = "REQ-NTS-05"
area = "NTS"
status = "ratified"
criticality = "medium"
statement = "The client shall hold up to eight cookies, spend one per request, take replacement cookies from each authenticated response, and repeat the key exchange only when it has no cookie left or after a NAK."
rationale = "The key exchange costs several seconds of CPU on the clock; hourly syncs must not repeat it."
cap = ["CAP-NTS"]

[[req]]
id = "REQ-NTS-06"
area = "NTS"
status = "ratified"
criticality = "high"
statement = "The TLS exporter used to derive the NTS keys shall produce exactly what OpenSSL produces for the same handshake."
rationale = "The exporter is a patch to a vendored TLS library; a wrong derivation makes every server reject our requests, a subtly wrong one could weaken the keys."
cap = ["CAP-NTS"]

[[req]]
id = "REQ-NTS-07"
area = "NTS"
status = "ratified"
criticality = "high"
statement = "The server certificate chain, the host name, the validity dates and the CertificateVerify signature shall all be verified against a built-in root before any result of the key exchange (cookies, keys) is used, even though the checks run after the key exchange."
rationale = "On the RP2040 the checks take about 5 s and NTS-KE servers drop a client that is silent for more than about 2 s in the middle of the handshake, so they are deferred. That is safe only because NTS-KE sends no secret and nothing is used before the checks pass."
cap = ["CAP-NTS"]

# ---------------------------------------------------------------------------------------------------- NTP server

[[req]]
id = "REQ-SRV-01"
area = "NTP server"
status = "ratified"
criticality = "medium"
statement = "The clock shall offer an NTP server on UDP 123 that is off by default and can be switched on and off at run time."
rationale = "Requested option; exposing a service must be opt-in."
cap = ["CAP-CONFIG", "CAP-NET"]

[[req]]
id = "REQ-SRV-02"
area = "NTP server"
status = "ratified"
criticality = "high"
statement = "The server shall answer valid client requests with a server-mode reply that echoes the client's transmit timestamp and the request's version."
rationale = "Clients reject replies that do not echo their timestamp."
cap = ["CAP-SNTP", "CAP-NET"]

[[req]]
id = "REQ-SRV-03"
area = "NTP server"
status = "ratified"
criticality = "high"
statement = "The server shall ignore anything that is not a well-formed client request, shall never send a reply larger than the request, and shall mark replies unsynchronised when no NTP sync happened in the last 24 hours."
rationale = "Prevents reflection and amplification, reply loops and serving stale time as good time."
cap = ["CAP-SNTP", "CAP-NET"]

[[req]]
id = "REQ-SRV-04"
area = "NTP server"
status = "ratified"
criticality = "medium"
statement = "Right after a sync the server's time shall be within 100 ms of an NTP-synchronised reference."
rationale = "Whole-second RTC time alone gave errors above one second; the server uses a software clock anchored at the RTC set instant."
cap = ["CAP-NET", "CAP-APP"]

# ---------------------------------------------------------------------------------------------------- network

[[req]]
id = "REQ-NET-01"
area = "Network"
status = "ratified"
criticality = "high"
statement = "The clock shall store up to eight WiFi networks and join the first one in slot order that is reachable."
rationale = "Requested; allows moving between locations without reconfiguring."
cap = ["CAP-CONFIG", "CAP-NET"]

[[req]]
id = "REQ-NET-02"
area = "Network"
status = "ratified"
criticality = "medium"
statement = "The clock's network name shall be `picoclock-` followed by the last octet of its MAC address in hexadecimal."
rationale = "Requested; tells several clocks on one LAN apart."
cap = ["CAP-CONFIG", "CAP-NET", "CAP-CLI"]

[[req]]
id = "REQ-NET-03"
area = "Network"
status = "ratified"
criticality = "medium"
statement = "When the credentials of the active network change, the clock shall leave it and join again without a reboot."
rationale = "Settings changes must take effect at once."
cap = ["CAP-NET"]

[[req]]
id = "REQ-NET-06"
area = "Network"
status = "ratified"
criticality = "medium"
statement = "A WiFi join attempt that does not finish within 15 seconds shall be abandoned, a transient failure shall be retried on the same network, and the clock shall keep trying until it is connected."
rationale = "Found on the hardware: the radio driver waits for an event that can be lost, so one lost event left the clock offline until reset, and an access point sometimes rejects the first authentication."
cap = ["CAP-NET"]

[[req]]
id = "REQ-NET-04"
area = "Network"
status = "draft"
criticality = "low"
statement = "The clock shall scan and prefer the strongest known network instead of trying slots in order."
rationale = "Roadmap."
cap = []

[[req]]
id = "REQ-NET-05"
area = "Network"
status = "draft"
criticality = "low"
statement = "The clock shall accept NTP servers from DHCP option 42 and shall be reachable as picoclock.local over mDNS."
rationale = "Roadmap."
cap = []

# ---------------------------------------------------------------------------------------------------- configuration

[[req]]
id = "REQ-CFG-01"
area = "Configuration"
status = "ratified"
criticality = "high"
statement = "The USB terminal, the web page and flash storage shall share one validated key/value model, and an invalid value shall leave the setting unchanged."
rationale = "One parser removes divergence between the three front ends."
cap = ["CAP-CONFIG", "CAP-CLI", "CAP-HTTP"]

[[req]]
id = "REQ-CFG-02"
area = "Configuration"
status = "ratified"
criticality = "high"
statement = "Settings shall persist in flash with a checksum; a blank or corrupt record shall give the defaults, and unknown keys or invalid stored values shall be skipped."
rationale = "A torn write or a firmware downgrade must never brick the configuration."
cap = ["CAP-CONFIG"]

[[req]]
id = "REQ-CFG-03"
area = "Configuration"
status = "ratified"
criticality = "high"
statement = "Passwords shall never be displayed by the terminal or the web page, and a blank password field shall keep the current value."
rationale = "Prevents shoulder-surfing and leaking secrets into page sources and screenshots."
cap = ["CAP-CONFIG", "CAP-HTTP", "CAP-CLI"]

[[req]]
id = "REQ-CFG-04"
area = "Configuration"
status = "ratified"
criticality = "medium"
statement = "The defaults shall be: NTP servers `gateway,pool.ntp.org`, timezone `utc`, NTP server off, web page on."
rationale = "Requested defaults."
cap = ["CAP-CONFIG"]

[[req]]
id = "REQ-CFG-05"
area = "Configuration"
status = "ratified"
criticality = "medium"
statement = "Settings changed on the USB terminal shall take effect at once and be written to flash only by `save`; the web page and the buttons save for the user."
rationale = "What the terminal and the README say; found on the hardware that a debounced save also wrote terminal edits, so trying a value was not reversible by a reboot."
cap = ["CAP-CLI", "CAP-CONFIG"]

# ---------------------------------------------------------------------------------------------------- terminal

[[req]]
id = "REQ-CLI-01"
area = "Terminal"
status = "ratified"
criticality = "medium"
statement = "The clock shall provide a terminal over USB serial with commands to show, get, set, save and reset settings, show status and time, list zones, sync, look up the zone, reboot and enter flashing mode."
rationale = "Requested terminal-based configuration interface."
cap = ["CAP-CLI"]

[[req]]
id = "REQ-CLI-02"
area = "Terminal"
status = "ratified"
criticality = "low"
statement = "Zone listings shall be capped so one command cannot flood the console."
rationale = "486 names would scroll away any other output."
cap = ["CAP-CLI"]

# ---------------------------------------------------------------------------------------------------- web

[[req]]
id = "REQ-WEB-01"
area = "Web"
status = "ratified"
criticality = "medium"
statement = "The clock shall serve a web page on port 80 that shows status and edits every setting, and the page shall fit the response buffer with all fields at maximum length."
rationale = "Requested web-based configuration interface."
cap = ["CAP-HTTP"]

[[req]]
id = "REQ-WEB-02"
area = "Web"
status = "ratified"
criticality = "high"
statement = "The HTTP parser shall be bounded: oversize, malformed, duplicate-length and hostile requests shall be refused without panicking or unbounded memory use."
rationale = "The server faces the whole LAN."
cap = ["CAP-HTTP"]

[[req]]
id = "REQ-WEB-03"
area = "Web"
status = "ratified"
criticality = "high"
statement = "A settings change submitted with a foreign Origin shall be refused."
rationale = "Stops a web page in the user's browser from changing the clock's settings."
cap = ["CAP-HTTP"]

[[req]]
id = "REQ-WEB-04"
area = "Web"
status = "ratified"
criticality = "high"
statement = "When a web password is set, the web page shall require HTTP Basic authentication with user `admin`."
rationale = "Optional access control for a plain-HTTP interface."
cap = ["CAP-HTTP"]

[[req]]
id = "REQ-WEB-05"
area = "Web"
status = "ratified"
criticality = "medium"
statement = "All setting values written into the page shall be HTML-escaped."
rationale = "A stored SSID must not become script."
cap = ["CAP-HTTP"]

[[req]]
id = "REQ-WEB-06"
area = "Web"
status = "draft"
criticality = "high"
statement = "On the Pico 2 W build the web page shall be available over HTTPS with a certificate generated on the device at first boot and replaceable by an uploaded certificate and key; the Pico W build keeps plain HTTP."
rationale = "Decided in ADR-0002 (2026-10-16). A default private key shipped in an open repository is public, so none is shipped. rustls does not build for the RP2040, so HTTPS comes with the Pico 2 W; it needs the Pico 2 W build to run on hardware first (REQ-HW-06)."
cap = []

# ---------------------------------------------------------------------------------------------------- display and interaction

[[req]]
id = "REQ-DSP-01"
area = "Display"
status = "ratified"
criticality = "high"
statement = "The firmware shall compose the 32x8 matrix, weekday LEDs and status icons into the panel's row format so that glyphs, shifts and icons do not disturb each other."
rationale = "The panel's shift-register layout has quirks (column offsets, group boundaries) inherited from the vendor demo."
cap = ["CAP-FRAME", "CAP-DISPLAY"]

[[req]]
id = "REQ-DSP-02"
area = "Display"
status = "ratified"
criticality = "high"
statement = "During normal operation (WiFi connected, web page and NTP in use) the display scan's row timer shall fire more than 100 microseconds late less than once per minute on average, and the terminal `status` shall report the measured lateness."
rationale = "A late row timer lengthens that row's on-time, which shows as a flickering line, worst at low brightness. Found on the hardware: the settings lock disabled interrupts for hundreds of microseconds about twice a second."
cap = ["CAP-DISPLAY", "CAP-APP", "CAP-CLI"]

[[req]]
id = "REQ-UI-01"
area = "Interaction"
status = "ratified"
criticality = "high"
statement = "The SET button shall cycle the time, date and temperature views and return to the time view after a timeout."
rationale = "Requested button support."
cap = ["CAP-UI", "CAP-INPUT"]

[[req]]
id = "REQ-UI-02"
area = "Interaction"
status = "ratified"
criticality = "medium"
statement = "The display shall support 24-hour and 12-hour time and Celsius and Fahrenheit, with correct handling of negative and out-of-range temperatures."
rationale = "Regional preferences."
cap = ["CAP-UI"]

[[req]]
id = "REQ-UI-03"
area = "Interaction"
status = "ratified"
criticality = "medium"
statement = "UP and DOWN shall step the brightness through auto and fixed levels without wrapping."
rationale = "Requested; everyday control without the menu."
cap = ["CAP-UI", "CAP-INPUT"]

[[req]]
id = "REQ-UI-04"
area = "Interaction"
status = "ratified"
criticality = "medium"
statement = "Holding SET shall open a settings menu covering alarm, chime, key beep, 12/24 h, C/F and brightness, which times out when idle."
rationale = "Everyday settings without a computer."
cap = ["CAP-UI", "CAP-INPUT"]

[[req]]
id = "REQ-UI-05"
area = "Interaction"
status = "ratified"
criticality = "high"
statement = "An enabled alarm shall ring once at the configured local time, stop on any button or by itself, and not ring when disabled or when the clock is unset."
rationale = "An alarm that retriggers or never stops is worse than none."
cap = ["CAP-UI", "CAP-BUZZER"]

[[req]]
id = "REQ-UI-06"
area = "Interaction"
status = "ratified"
criticality = "low"
statement = "The clock shall beep on button presses and on the hour when those settings are on, and the chime shall not sound over an alarm."
rationale = "Requested buzzer support."
cap = ["CAP-UI", "CAP-BUZZER"]

[[req]]
id = "REQ-UI-07"
area = "Interaction"
status = "ratified"
criticality = "low"
statement = "The colon shall blink only while the time is NTP-synchronised, and the status icons shall reflect the settings."
rationale = "The panel has no spare WiFi icon, so the colon and count-up icon carry the sync state."
cap = ["CAP-UI"]

