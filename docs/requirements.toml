area = "NTP client"
status = "ratified"
criticality = "medium"
statement = "The clock shall support secure NTP (NTS, RFC 8915) for its upstream servers."
rationale = "Requested. Feasibility and design are in ADR-0001; the specific obligations are REQ-NTS-01 to REQ-NTS-07."
cap = ["CAP-NTS", "CAP-SNTP", "CAP-NET"]

# ---------------------------------------------------------------------------------------------------- non-functional

[[req]]
id = "REQ-NFR-01"
area = "Non-functional"
status = "ratified"
criticality = "medium"
statement = "The firmware image and the settings sector shall fit the flash of the target board without overlapping, and the static RAM shall fit the chip."
rationale = "The settings sector sits after the program image."
cap = ["CAP-APP", "CAP-CONFIG"]

[[req]]
id = "REQ-NFR-02"
area = "Non-functional"
status = "ratified"
criticality = "high"
statement = "The display scan shall run at a priority above all networking tasks."
rationale = "WiFi activity must not make the display flicker."
cap = ["CAP-APP", "CAP-DISPLAY"]
unverified = "This is the design property; its outcome (scan timing under load, and the owner seeing no flicker) is recorded under REQ-DSP-02 (VR-22, VR-24). Nothing tests the priority arrangement itself."
