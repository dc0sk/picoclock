[[req]]
id = "REQ-HW-03"
area = "Hardware"
status = "ratified"
criticality = "medium"
statement = "The clock shall drive the buzzer for key beeps, the hourly chime and the alarm."
rationale = "Requested buzzer support."
cap = ["CAP-BUZZER"]

[[req]]
id = "REQ-HW-04"
area = "Hardware"
status = "ratified"
criticality = "medium"
statement = "The clock shall set the display brightness from the ambient light sensor when brightness is `auto`."
rationale = "Requested ambient light sensor support."
cap = ["CAP-APP", "CAP-DISPLAY"]

[[req]]
id = "REQ-HW-05"
area = "Hardware"
status = "ratified"
criticality = "high"
statement = "The firmware shall run on the Raspberry Pi Pico W (RP2040)."
rationale = "The hardware installed in the clock."
cap = ["CAP-APP"]

[[req]]
id = "REQ-HW-06"
area = "Hardware"
