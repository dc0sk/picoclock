# ---------------------------------------------------------------------------------------------------- non-functional

[[req]]
id = "REQ-NFR-01"
area = "Non-functional"
status = "ratified"
criticality = "medium"
statement = "The firmware image and the settings sector shall fit the flash of the target board without overlapping, and the static RAM shall fit the chip."
rationale = "The settings sector sits after the program image."
cap = ["CAP-APP", "CAP-CONFIG"]

[[req]]
id = "REQ-NFR-02"
area = "Non-functional"
status = "ratified"
criticality = "high"
statement = "The display scan shall run at a priority above all networking tasks."
rationale = "WiFi activity must not make the display flicker."
cap = ["CAP-APP", "CAP-DISPLAY"]

[[req]]
id = "REQ-NFR-03"
area = "Non-functional"
status = "ratified"
criticality = "medium"
statement = "A hardware watchdog shall restart the clock if its clock task (which owns the RTC bus) has not run for 5 seconds or the executor is starved for 8 seconds; the restart is not caused by long operations (flash saves, the NTS key exchange); `status` shall say when the last restart was caused by the watchdog."
rationale = "Found by the full-code review of 2026-10-17: a hung RTC bus or a spinning task froze the clock until the power was cycled. Decided by the owner the same day."
cap = ["CAP-APP", "CAP-CLI"]

[[req]]
id = "REQ-RNG-01"
area = "Non-functional"
status = "ratified"
criticality = "high"
statement = "On the Pico W (RP2040), which has no hardware random number generator, random bytes shall be made from ring-oscillator bits read at spaced-out times and hashed together with the time, a counter and the previous state, using 64 raw bytes for every 32 output bytes; a stuck source must still give different blocks."
rationale = "Found by the full-code review of 2026-10-17: the bits were read back to back, so they are correlated, and they feed the NTS key exchange, nonces and the network stack. Decided by the owner the same day. The Pico 2 W uses the chip's TRNG."
cap = ["CAP-ENTROPY", "CAP-APP"]
