# Source of truth for the SRS (docs/srs.md) and the traceability matrix (docs/traceability-matrix.md).
# Both are generated by `tools/trace.py render`; do not edit them by hand.
#
# [[req]]  status: draft | ratified | retired.  criticality: high | medium | low (sets how much evidence is needed).
#          `cap`   : the capabilities (code) that implement it.
#          `unverified` : ratified but no evidence exists yet; the text says why. It is listed in the matrix.
#          A statement is never edited once ratified: retire it (retired_because) and add a new ID (supersedes).
# [[cap]]  `code` globs bind every production source file to exactly one capability.
# Evidence is bound in the code and the log, not here:
#   unit tests : a `// VERIFIES: REQ-..` comment directly above the #[test]
#   records    : `Verifies:` lines in docs/verification-log.md

