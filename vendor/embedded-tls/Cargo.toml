[package]
name = "embedded-tls"
version = "0.19.0"
edition = "2024"
description = "TLS 1.3 client with no_std support and no allocator"
documentation = "https://docs.rs/embedded-tls"
readme = "README.md"
homepage = "https://embassy.dev"
repository = "https://github.com/embassy-rs/embedded-tls"
license = "Apache-2.0"
keywords = ["embedded", "async", "tls", "no_std", "network"]
exclude = [".github"]

[package.metadata.docs.rs]
features = ["webpki", "rustpki", "rsa", "ed25519", "p256", "p384", "x25519", "mlkem"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embassy-crypto = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
portable-atomic = { version = "1.6.0", default-features = false }
rsa = { version = "0.9.9", default-features = false, features = ["sha2"], optional = true }
heapless = { version = "0.9", default-features = false }
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-io-adapters = { version = "0.7", optional = true }
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, optional = true }
pki-types = { package = "rustls-pki-types", version = "1.14", default-features = false, optional = true }
der = { version = "0.8", features = ["derive", "oid", "heapless"] }
dhkem = { version = "0.1.0", default-features = false, optional = true }
ml-kem = { version = "0.3.2", default-features = false, optional = true }

# Logging alternatives
log = { version = "0.4", optional = true }
defmt = { version = "1.0.1", optional = true }


[features]
default = ["std", "log", "tokio", "p256"]
defmt = ["dep:defmt", "embedded-io/defmt", "heapless/defmt", "embassy-crypto/defmt"]
std = ["embedded-io/std", "embedded-io-async/std"]
tokio = ["embedded-io-adapters/tokio-1"]
webpki = ["dep:webpki", "dep:pki-types"]
rustpki = []
rsa = ["dep:rsa"]
ed25519 = []
p256 = []
p384 = []
x25519 = []
mlkem = ["dep:dhkem", "dep:ml-kem"]
