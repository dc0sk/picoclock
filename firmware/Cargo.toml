[package]
name = "picoclock"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pico-Clock-Green firmware for the Raspberry Pi Pico W with WiFi and NTP"

[dependencies]
picoclock-core = { path = "../core" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040", "executor-thread", "executor-interrupt"] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "udp", "tcp", "tcp-listener", "dhcpv4", "medium-ethernet", "dns", "ipv4", "hostname"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
static_cell = "2.1"
heapless = { version = "0.9", default-features = false }
embedded-io-async = "0.7.0"
portable-atomic = { version = "1.5", features = ["critical-section"] }
