[package]
name = "picoclock"
version = "0.2.2"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Pico-Clock-Green firmware for the Raspberry Pi Pico W / Pico 2 W with WiFi and NTP"

[features]
# Pick exactly one chip. Pico W (default): target thumbv6m-none-eabi. Pico 2 W: --no-default-features --features rp235x
# --target thumbv8m.main-none-eabihf.
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040"]
# Custom builds (README, "Custom builds"): uploaded images are installed without the signature and version checks, so anyone can run
# their own build. Never in an official release: those carry the signing keys' protection.
custom-images = []
# Test build without the receiver (ADR-0007 point 10): the GPS task makes its own NMEA sentences and PPS edges from the clock's time plus
# GPS_SIM_OFFSET_S (a build-time environment variable, default 0). Never in a release: it exercises the wiring, not the wire.
gps-sim = []
# The Pico 2 W has a heap, so it also verifies RSA certificate chains for NTS (the RP2040 build does not: no allocator).
rp235x = ["embassy-rp/rp235xa", "https", "picoclock-core/rsa"]
# HTTPS for the web page (ADR-0002): rustls needs an allocator, so it is only built for the Pico 2 W (the RP2040 has no
# atomic compare-and-swap, which rustls needs).
https = ["dep:rustls", "dep:rustls-rustcrypto", "dep:embedded-alloc", "dep:getrandom"]

[dependencies]
picoclock-core = { path = "../core" }
rustls = { version = "0.23", default-features = false, features = ["custom-provider"], optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc"], optional = true }
embedded-alloc = { version = "0.7", optional = true }
getrandom = { version = "0.2", features = ["custom"], optional = true }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-boot-rp = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "executor-thread", "executor-interrupt"] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt", "udp", "tcp", "tcp-listener", "dhcpv4", "medium-ethernet", "dns", "ipv4", "hostname", "dhcpv4-options", "multicast", "icmp-ping-reply"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = ["defmt"] }
# NTS: the TLS client is vendored (vendor/embedded-tls); its primitives are embassy-crypto drivers linked here.
embedded-tls = { path = "../vendor/embedded-tls", default-features = false, features = ["webpki", "p256", "p384", "defmt"] }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "cbb7990a5cce4be3650d804f9733f4a01bb1a967", features = [
    "embassy-crypto-sha256", "embassy-crypto-sha384", "embassy-crypto-hmac-sha256", "embassy-crypto-hmac-sha384",
    "embassy-crypto-aes128-gcm", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa", "embassy-crypto-p384-ecdsa",
] }
sha2 = { version = "0.11", default-features = false }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
static_cell = "2.1"
rand_core = { version = "0.6", default-features = false }
heapless = { version = "0.9", default-features = false }
embedded-io-async = "0.7.0"
portable-atomic = { version = "1.5", features = ["critical-section"] }
